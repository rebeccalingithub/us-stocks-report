<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美股报告看板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            color: #1d1d1f;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* 头部 */
        .header {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .header-info {
            font-size: 13px;
            color: #6b7c93;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00b42a;
            border-radius: 50%;
            margin-right: 6px;
        }

        /* 标签切换 */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            background: white;
            padding: 6px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            background: transparent;
            color: #6b7c93;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #165dff;
            color: white;
        }

        /* 报告内容区域 */
        .report-frame {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .report-frame iframe {
            width: 100%;
            min-height: 800px;
            border: none;
            display: block;
        }

        /* 历史报告 */
        .history-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .history-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .history-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .history-item {
            padding: 8px 16px;
            background: #f5f7fa;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #e8ecf1;
        }

        .history-item.active {
            background: #165dff;
            color: white;
        }

        .history-item .tag {
            font-size: 11px;
            margin-left: 4px;
            opacity: 0.8;
        }

        /* 底部 */
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: #9ca3af;
        }

        /* ========== 手机端优化 ========== */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .header {
                padding: 16px;
            }

            .header h1 {
                font-size: 18px;
            }

            .header-info {
                font-size: 12px;
                gap: 12px;
            }

            .tab-btn {
                padding: 10px 12px;
                font-size: 13px;
            }

            .report-frame iframe {
                min-height: 600px;
            }

            .history-section {
                padding: 16px;
            }

            .history-item {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>📊 美股报告看板</h1>
            <div class="header-info">
                <span><span class="status-dot"></span>运行正常</span>
                <span>📅 下次更新：明日 05:00</span>
                <span>🔒 数据来源：富途 OpenAPI</span>
            </div>
        </div>

        <!-- 标签切换 -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('invest')">📈 投资报告</button>
            <button class="tab-btn" onclick="switchTab('daily')">📋 大盘报告</button>
        </div>

        <!-- 报告内容 -->
        <div class="report-frame">
            <iframe id="reportFrame" src="latest-invest-report.html" onload="adjustFrameHeight(this)"></iframe>
        </div>

        <!-- 历史报告 -->
        <div class="history-section">
            <div class="history-title">📅 历史报告</div>
            <div class="history-list">
                <div class="history-item active" onclick="loadReport('2026-05-19')">
                    5月19日<span class="tag">最新</span>
                </div>
                <div class="history-item" onclick="loadReport('2026-05-18')">5月18日</div>
                <div class="history-item" onclick="loadReport('2026-05-17')">5月17日</div>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer">
            <div>数据仅供参考，不构成投资建议 · 更新时间：2026-05-20</div>
        </div>
    </div>

    <script>
        let currentTab = 'invest';
        
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const frame = document.getElementById('reportFrame');
            if (tab === 'invest') {
                frame.src = 'latest-invest-report.html';
            } else {
                frame.src = 'latest-daily-report.html';
            }
        }

        function loadReport(date) {
            const frame = document.getElementById('reportFrame');
            if (currentTab === 'invest') {
                frame.src = `archive/${date}/美股投资报告_${date}.html`;
            } else {
                frame.src = `archive/${date}/美股大盘报告_${date}.html`;
            }
            document.querySelectorAll('.history-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // 自适应 iframe 高度
        function adjustFrameHeight(frame) {
            setTimeout(() => {
                try {
                    const body = frame.contentDocument.body;
                    const html = frame.contentDocument.documentElement;
                    const height = Math.max(body.scrollHeight, body.offsetHeight, html.clientHeight, html.scrollHeight, html.offsetHeight);
                    frame.style.height = (height + 50) + 'px';
                } catch (e) {
                    // 跨域无法获取，使用默认高度
                }
            }, 500);
        }
    </script>
</body>
</html>
