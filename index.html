<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美股报告看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#f5f7fa;color:#1d1d1f;line-height:1.6}
.container{max-width:980px;margin:0 auto;padding:20px 16px}
.header{background:#fff;padding:24px;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.header h1{font-size:22px;font-weight:600;margin-bottom:12px}
.header-info{font-size:13px;color:#6b7c93;display:flex;gap:20px;flex-wrap:wrap}
.status-dot{display:inline-block;width:8px;height:8px;background:#00b42a;border-radius:50%;margin-right:6px}
.nav-tabs{display:flex;gap:8px;margin-bottom:16px;background:#fff;padding:6px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tab-btn{flex:1;padding:12px 16px;border:none;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:#6b7c93;transition:all .2s}
.tab-btn.active{background:#0071e3;color:#fff}
.report-frame{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden}
.report-frame iframe{width:100%;min-height:820px;border:none;display:block}
.history-section{background:#fff;border-radius:12px;padding:20px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.history-title{font-size:15px;font-weight:600;margin-bottom:12px}
.history-list{display:flex;gap:8px;flex-wrap:wrap}
.history-item{padding:8px 16px;background:#f5f7fa;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s}
.history-item:hover{background:#e8ecf1}
.history-item.active{background:#0071e3;color:#fff}
.history-item .tag{font-size:11px;margin-left:4px;opacity:.8}
.footer{text-align:center;padding:24px;font-size:12px;color:#9ca3af}
@media(max-width:600px){
  .container{padding:12px}.header{padding:16px}.header h1{font-size:18px}
  .tab-btn{padding:10px 12px;font-size:13px}.report-frame iframe{min-height:600px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>美股报告看板</h1>
    <div class="header-info">
      <span><span class="status-dot"></span>运行正常</span>
      <span>数据日期：2026年07月13日</span>
      <span>下次更新：7月14日 06:30</span>
      <span>数据来源：富途 OpenD + Yahoo Finance</span>
    </div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('daily',this)">大盘报告</button>
    <button class="tab-btn" onclick="switchTab('invest',this)">投资报告</button>
  </div>

  <div class="report-frame">
    <iframe id="reportFrame" src="latest-daily-report.html" onload="adjustHeight(this)"></iframe>
  </div>

  <div class="history-section">
    <div class="history-title">历史报告</div>
    <div class="history-list">
                <div class="history-item active" onclick="loadReport('2026-07-13')">7月13日 <span class="tag">最新</span></div>
                <div class="history-item" onclick="loadReport('2026-07-10')">7月10日</div>
                <div class="history-item" onclick="loadReport('2026-07-08')">7月8日</div>
    </div>
  </div>

  <div class="footer">
    数据仅供参考，不构成投资建议 &nbsp;·&nbsp; 更新时间：2026-07-13 &nbsp;·&nbsp; 数据来源：富途 OpenD
  </div>
</div>
<script>
let curTab='daily';
function switchTab(tab,btn){
  curTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const srcs={'daily':'latest-daily-report.html','invest':'latest-invest-report.html'};
  document.getElementById('reportFrame').src=srcs[tab]||'latest-daily-report.html';
}
function loadReport(dt){
  const f=document.getElementById('reportFrame');
  if(curTab==='trump'){f.src='latest-trump-report.html';return;}
  f.src=curTab==='daily'?'archive/'+dt+'/daily_'+dt+'.html':'archive/'+dt+'/invest_'+dt+'.html';
  document.querySelectorAll('.history-item').forEach(i=>i.classList.remove('active'));
  event.currentTarget.classList.add('active');
}
function adjustHeight(frame){
  setTimeout(()=>{
    try{
      const b=frame.contentDocument.body,h=frame.contentDocument.documentElement;
      frame.style.height=(Math.max(b.scrollHeight,b.offsetHeight,h.scrollHeight,h.offsetHeight)+50)+'px';
    }catch(e){}
  },600);
}
</script>
</body>
</html>
