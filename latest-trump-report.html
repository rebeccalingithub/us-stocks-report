<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8">
<title>聪明钱</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
       background: #f5f5f7; color: #1d1d1f; font-size: 15px; line-height: 1.6; }
.container { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
h1 { font-size: 2rem; font-weight: 700; color: #1d1d1f; margin-bottom: 4px; }
.subtitle { color: #86868b; font-size: 0.9rem; margin-bottom: 32px; }
.section { background: #fff; border-radius: 18px; padding: 24px 28px; margin-bottom: 20px;
           box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.section h2 { font-size: 1.15rem; font-weight: 700; color: #0071e3; margin-bottom: 16px;
              padding-bottom: 10px; border-bottom: 1.5px solid #e5e5ea; }
.section h3 { font-size: 1rem; font-weight: 600; margin: 14px 0 8px; color: #1d1d1f; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 14px; }
.card { background: #f5f5f7; border-radius: 14px; padding: 16px 18px; }
.card .label { font-size: 0.75rem; color: #86868b; margin-bottom: 4px; letter-spacing: .5px; text-transform: uppercase; }
.card .price { font-size: 1.6rem; font-weight: 700; color: #1d1d1f; }
.card .meta { font-size: 0.82rem; color: #86868b; margin-top: 6px; }
.stock-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.stock-table th { background: #f5f5f7; padding: 9px 10px; text-align: left; font-weight: 600;
                  color: #86868b; font-size: 0.78rem; text-transform: uppercase; letter-spacing: .5px; }
.stock-table td { padding: 9px 10px; border-bottom: 1px solid #f2f2f2; vertical-align: middle; }
.stock-table tr:last-child td { border-bottom: none; }
.stock-table tr:hover td { background: #f9f9fb; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
.badge-up { background: #e8f9ee; color: #1a7a3c; }
.badge-down { background: #fff0f0; color: #c0392b; }
.badge-warn { background: #fff4e0; color: #b36200; }
.badge-buy { background: #e8f0ff; color: #0051a2; }
.badge-neutral { background: #f2f2f7; color: #555; }
.quant-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 6px; }
.quant-item { background: #f5f5f7; border-radius: 10px; padding: 8px 12px; text-align: center; }
.quant-item .ql { font-size: 0.7rem; color: #86868b; margin-bottom: 2px; }
.quant-item .qv { font-size: 1rem; font-weight: 700; }
.risk-item { padding: 8px 0; border-bottom: 1px solid #f2f2f2; display: flex; gap: 10px; align-items: flex-start; }
.risk-item:last-child { border-bottom: none; }
.risk-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
ul.analysis-list { padding-left: 20px; }
ul.analysis-list li { margin-bottom: 6px; }
.factor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
.factor-card { background: #f5f5f7; border-radius: 12px; padding: 14px 16px; }
.factor-card .ft { font-size: 0.75rem; color: #86868b; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .5px; }
.factor-card .fv { font-size: 0.95rem; font-weight: 600; }
.earnings-table, .event-table, .trend-table {
  width: 100%; border-collapse: collapse; font-size: 0.88rem; }
.earnings-table th, .event-table th, .trend-table th {
  background: #f5f5f7; padding: 8px 12px; text-align: left; font-weight: 600;
  color: #86868b; font-size: 0.78rem; text-transform: uppercase; }
.earnings-table td, .event-table td, .trend-table td {
  padding: 8px 12px; border-bottom: 1px solid #f2f2f2; vertical-align: middle; }
/* Fear & Greed gauge */
.fg-wrap { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 12px 0; }
.fg-gauge { flex: 1; min-width: 200px; }
.fg-bar-bg { height: 14px; border-radius: 8px; background: linear-gradient(to right,
  #2196f3 0%, #4caf50 25%, #ffeb3b 50%, #ff9800 75%, #f44336 100%);
  position: relative; margin-bottom: 6px; }
.fg-needle { position: absolute; top: -4px; width: 4px; height: 22px; background: #1d1d1f;
  border-radius: 2px; transform: translateX(-2px); }
.fg-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: #86868b; }
.fg-score { font-size: 2.2rem; font-weight: 800; }
.fg-info { min-width: 180px; }
.fg-rating { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
.fg-guidance { background: #f5f5f7; border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; margin-top: 10px; }
/* Probability bar */
.prob-bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; min-width: 120px; }
.prob-yes { background: #34c759; }
.prob-no  { background: #ff3b30; }
/* Stock block */
.stock-block { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1.5px solid #f2f2f2; }
.stock-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.stock-block .sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.stock-block .sh .sname { font-size: 1.1rem; font-weight: 700; }
.stock-block .sh .sticker { font-size: 0.85rem; color: #86868b; }
.tech-text { font-size: 0.88rem; color: #444; margin: 8px 0; }
.hot-tag { display: inline-block; background: #fff4e0; color: #b36200; padding: 1px 7px;
  border-radius: 10px; font-size: 0.72rem; font-weight: 600; margin-left: 6px; }
/* Deep Analysis Panel */
.detail-btn { display:inline-flex; align-items:center; gap:4px; padding:3px 12px;
  border:1.5px solid #0071e3; border-radius:20px; background:transparent;
  color:#0071e3; font-size:.76rem; font-weight:600; cursor:pointer;
  margin-left:auto; transition:all .2s; white-space:nowrap; }
.detail-btn:hover, .detail-btn.active { background:#0071e3; color:#fff; }
.detail-panel { display:none; margin-top:14px; border-top:1.5px dashed #e5e5ea; padding-top:14px; }
.dp-section { margin-bottom:16px; }
.dp-section:last-child { margin-bottom:0; }
.dp-title { font-size:.72rem; font-weight:700; color:#86868b; text-transform:uppercase;
  letter-spacing:.5px; margin-bottom:8px; }
.dp-cards { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.dp-card { background:#f5f5f7; border-radius:10px; padding:9px 12px; }
.dp-label { font-size:.66rem; color:#86868b; margin-bottom:3px; text-transform:uppercase; letter-spacing:.4px; }
.dp-val { font-size:.98rem; font-weight:700; line-height:1.2; }
.dp-sub { font-size:.68rem; color:#86868b; margin-top:2px; line-height:1.3; }
/* Analyst rating bar */
.rating-bar { display:flex; height:8px; border-radius:5px; overflow:hidden; margin-top:6px; }
.rating-buy  { background:#34c759; }
.rating-hold { background:#ff9500; }
.rating-sell { background:#ff3b30; }
@media(max-width:600px){
  .cards { grid-template-columns: 1fr 1fr; }
  .quant-grid { grid-template-columns: 1fr 1fr; }
  .factor-grid { grid-template-columns: 1fr; }
  .dp-cards { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 1.5rem; }
  .fg-wrap { flex-direction: column; }
}
</style></head><body><div class="container">
<h1>聪明钱</h1>
<div class="section"><h2>数据未加载</h2>
<p>请先运行 <code>python fetch_trump_data.py 2026-07-01</code> 生成数据文件。</p>
</div></div></body></html>
